services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5711:5711"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5711/health/ready', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      # SQLite default; raise only if you know what you are doing.
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      # Optional absolute form if relative URL ever mis-resolves:
      # DATABASE_URL: sqlite:////app/data/database.db
    # Let the container reach QingLong / Bark services on the host machine.
    # Settings UI can use e.g. http://host.docker.internal:5700
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["sh", "/app/entrypoint.sh"]
    volumes:
      # Keep source mounts for the existing Windows workflow, but do not let
      # the container modify application code.
      - ./app:/app/app:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./static/uploads:/app/static/uploads
      - ./scripts:/app/scripts:ro
    restart: unless-stopped
